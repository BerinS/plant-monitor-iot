name: CI/CD

on:
  pull_request:            # run tests on every PR 
  push:
    branches: [main]       # full pipeline on main

# Default GITHUB_TOKEN can only read code
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # clone the repo onto the runner
      - uses: actions/setup-dotnet@v4      # install the .NET SDK
        with:
          dotnet-version: '10.0.x'
      - name: Run tests
        run: dotnet test PlantMonitoringAPI.Tests/PlantMonitoringAPI.Tests.csproj --configuration Release

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plantmonitoring_frontend   # every `run:` executes in this folder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                                   # reuse ~/.npm between runs 
          cache-dependency-path: plantmonitoring_frontend/package-lock.json
      - run: npm ci --legacy-peer-deps                 # same flag as your Dockerfile
      - run: npx ng build --configuration production   # catches template/type errors

  build-push:
    needs: [backend-tests, frontend-tests]         # only if all tests passed
    if: github.event_name == 'push'               
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                              # allow GITHUB_TOKEN to push to GHCR
    strategy:
      matrix:
        include:
          - service: backend
            context: ./PlantMonitoringAPI
          - service: frontend
            context: ./plantmonitoring_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3        # builder with caching support
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/berins/plant-monitor-iot-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/berins/plant-monitor-iot-${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/BerinS/plant-monitor-iot
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-push                  # skipped automatically if build-push was skipped/failed
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: sha-${{ github.sha }}
      