services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - plant-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
    ports:
      - "1883:1883"   # MQTT
      - "127.0.0.1:18083:18083" # Dashboard
    depends_on:
      - postgres
    networks:
      - plant-net
    restart: always

  backend:
    image: ghcr.io/berins/plant-monitor-iot-backend:${IMAGE_TAG:-latest}
    build: ./PlantMonitoringAPI
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Mqtt__BrokerHost: emqx
      Mqtt__BrokerPort: "1883"
      Mqtt__Username:   "backend-service"
      Mqtt__Password:   ${MQTT_BACKEND_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - plant-net
    restart: always

  frontend:
    image: ghcr.io/berins/plant-monitor-iot-frontend:${IMAGE_TAG:-latest}
    build: ./plantmonitoring_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - plant-net
    restart: always

networks:
  plant-net: